# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-sleep-lock.service.d/ (owner decision D-12, 2026-10-23:
# lock before sleep must always happen, as on macOS; this drop-in applies only while grassfield-security is up).
# Omarchy's unit holds a logind delay inhibitor and, before sleep, asks "the shell" to lock through `omarchy-shell`;
# after each sleep it exits and systemd starts it again (Restart=always), which runs this condition again.
# - The gate decides at each start of the unit: it is skipped when grassfield-security is up (active/running), because
#   that process then holds its own inhibitor and locks before sleep itself (shell/security/idle/SleepInhibitor.qml, in the
#   security process since ADR-0041 step 1, S2; the UI, grassfield-shell, holds none). A copy that started while the
#   security process was not up keeps running until its next sleep: at session start it is started with
#   graphical-session.target, usually before grassfield-security, and grassfield-security.service starts it (OnFailure=)
#   after every crash. Running next to it is harmless: it only asks grassfield-security to lock.
# - In the Grassfield session its `omarchy-shell` calls reach Grassfield's stand-in
#   (/usr/lib/grassfield/omarchy-shims/omarchy-shell, first in PATH only in this session), which starts grassfield-security
#   again when needed and asks it to lock; Omarchy's own shell is never involved. Its clamshell step
#   (omarchy-hyprland-monitor-clamshell) reaches Grassfield's stand-in too, which runs grassfield-lid's own reconcile.
#   If grassfield-security cannot start within logind's window, the machine sleeps without a lock and Omarchy's script
#   reports it: a known limit (docs/specs/security.md "Lock coverage"); a restarted security process then locks at once.
# - In the Omarchy session the gate always lets it run, exactly as Omarchy ships it.
[Service]
ExecCondition=/usr/lib/grassfield/sleep-lock-gate
